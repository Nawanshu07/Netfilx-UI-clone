<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix UI clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">
        <div class="box"></div>
        <nav>
            <span><img src="assests/image/logo.svg" alt="" ></span>
            <div class="buttons">
                <button class="btn btn-tr">English</button>
                <button class="btn btn-red-sm"">Sign in</button>
            </div>
        </nav>
        <div class="hero">
            <h1 class="heading">Enjoy big movies, hit series and more from ₹149</h1>
            <span>Join today, Cancel anytime.</span>
            <span>Ready to watch? Enter your email to start your membership.</span>
            <div class="buttons">
                <input type="text" placeholder="Enter Email" >
                <button class="btn-red btn">Get Started</button>
            </div>
        </div>
    </div>
    <div class="seperator">
    </div>
    <section class="first">
        <div>Enjoy your TV
            Watch on smart TVs, Playstation, Xbox, Chromecast, Apple TV, Blu-ray players and more.</div>
        <div class="secimg"></div>
    </section>
</body>
</html>
